<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 0;
      width: 90%;
      max-width: 90vw;
      height: 80%;
      max-height: 80vh;
    }
    .box {
      flex: 1;
      min-width: 0;
      padding: 2% 4%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 0.5vh;
    }
    .box.left {
      background:
        linear-gradient(180deg, rgba(91,33,182,0.85) 0%, transparent 45%, rgba(139,92,246,0.4) 100%),
        linear-gradient(90deg, rgba(91,33,182,0.85) 0%, transparent 45%, rgba(139,92,246,0.4) 100%),
        #7c3aed;
      border-radius: 10px 0 0 10px;
    }
    .box.right {
      background:
        linear-gradient(180deg, rgba(14,116,144,0.85) 0%, transparent 45%, rgba(34,211,238,0.4) 100%),
        linear-gradient(270deg, rgba(14,116,144,0.85) 0%, transparent 45%, rgba(34,211,238,0.4) 100%),
        #06b6d4;
      border-radius: 0 10px 10px 0;
    }
    .row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 4%;
      min-width: 0;
    }
    .box.left .row { flex-direction: row; }
    .box.right .row { flex-direction: row-reverse; }
    .score-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      flex-shrink: 0;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 1vh 2vw;
      border-radius: 1vh;
    }
    .race-to {
      font-size: clamp(8px, 2vh, 24px);
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .name {
      font-size: clamp(12px, 4vh, 48px);
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .score {
      font-size: clamp(24px, 12vh, 160px);
      font-weight: 800;
      color: #fff;
      line-height: 1;
      flex-shrink: 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box left">
      <div class="row">
        <span class="name" id="team1">Team 1</span>
        <div class="score-block">
          <span class="race-to" id="raceToLabel">Race to 13</span>
          <span class="score" id="score1">0</span>
        </div>
      </div>
    </div>
    <div class="box right">
      <div class="row">
        <span class="name" id="team2">Team 2</span>
        <div class="score-block">
          <span class="race-to" id="raceToLabel2">Race to 13</span>
          <span class="score" id="score2">0</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var room = params.get('room');
      var dbUrl = params.get('db') ? decodeURIComponent(params.get('db')) : '';

      function applyState(data) {
        var d = data || {};
        var team1 = (d.team1 != null ? d.team1 : 'Team 1').toString();
        var team2 = (d.team2 != null ? d.team2 : 'Team 2').toString();
        var s1 = (d.s1 != null ? d.s1 : 0).toString();
        var s2 = (d.s2 != null ? d.s2 : 0).toString();
        var raceTo1 = (d.raceTo1 != null ? d.raceTo1 : 13).toString();
        var raceTo2 = (d.raceTo2 != null ? d.raceTo2 : 13).toString();
        document.getElementById('raceToLabel').textContent = 'Race to ' + raceTo1;
        document.getElementById('raceToLabel2').textContent = 'Race to ' + raceTo2;
        document.getElementById('team1').textContent = team1;
        document.getElementById('team2').textContent = team2;
        document.getElementById('score1').textContent = s1;
        document.getElementById('score2').textContent = s2;
      }

      if (room && dbUrl) {
        var url = dbUrl.replace(/\/$/, '') + '/rooms/' + encodeURIComponent(room) + '.json';
        function poll() {
          fetch(url).then(function(r) { return r.json(); }).then(applyState).catch(function() {});
        }
        poll();
        setInterval(poll, 2000);
      } else {
        var t1 = params.get('team1');
        var t2 = params.get('team2');
        applyState({
          team1: t1 ? decodeURIComponent(t1) : 'Team 1',
          team2: t2 ? decodeURIComponent(t2) : 'Team 2',
          s1: params.get('s1') || '0',
          s2: params.get('s2') || '0',
          raceTo1: params.get('raceTo1') || params.get('raceTo') || '13',
          raceTo2: params.get('raceTo2') || params.get('raceTo') || '13'
        });
      }
    })();
  </script>
</body>
</html>
