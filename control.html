<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 24px;
      color: #fff;
    }
    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .field {
      flex: 1;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    input:focus {
      outline: none;
      border-color: #6366f1;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary {
      background: #6366f1;
      color: #fff;
      margin-bottom: 10px;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
    .url-box {
      margin-top: 20px;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      font-size: 0.75rem;
      word-break: break-all;
      color: rgba(255,255,255,0.8);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: #22c55e;
      color: #fff;
      border-radius: 8px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Scoreboard overlay control</h1>
    <div class="field">
      <label>Team 1 name</label>
      <input type="text" id="team1" value="Team 1" placeholder="Team 1">
    </div>
    <div class="field" style="margin-top: 12px;">
      <label>Team 2 name</label>
      <input type="text" id="team2" value="Team 2" placeholder="Team 2">
    </div>
    <div class="row" style="margin-top: 12px;">
      <div class="field">
        <label>Race to (Team 1)</label>
        <input type="number" id="raceTo1" value="13" min="1" max="99" placeholder="13">
      </div>
      <div class="field">
        <label>Race to (Team 2)</label>
        <input type="number" id="raceTo2" value="13" min="1" max="99" placeholder="13">
      </div>
    </div>
    <div class="row" style="margin-top: 12px;">
      <div class="field">
        <label>Score 1</label>
        <input type="number" id="s1" value="0" min="0" max="999">
      </div>
      <div class="field">
        <label>Score 2</label>
        <input type="number" id="s2" value="0" min="0" max="999">
      </div>
    </div>
    <button class="btn btn-primary" id="copyUrl">Copy overlay URL</button>
    <button class="btn btn-secondary" id="openUrl">Open overlay (preview)</button>
    <div class="url-box" id="urlBox"></div>
  </div>
  <div class="toast" id="toast">URL copied to clipboard</div>
  <script>
    function buildUrl() {
      var path = location.pathname.replace(/\/?control\.html$/, '') || '/';
      var base = location.origin + (path.endsWith('/') ? path : path + '/') + 'index.html';
      var params = new URLSearchParams();
      params.set('team1', document.getElementById('team1').value || 'Team 1');
      params.set('team2', document.getElementById('team2').value || 'Team 2');
      params.set('raceTo1', document.getElementById('raceTo1').value || '13');
      params.set('raceTo2', document.getElementById('raceTo2').value || '13');
      params.set('s1', document.getElementById('s1').value || '0');
      params.set('s2', document.getElementById('s2').value || '0');
      return base + (base.includes('?') ? '&' : '?') + params.toString();
    }
    function updateUrlBox() {
      document.getElementById('urlBox').textContent = 'Overlay URL: ' + buildUrl();
    }
    document.getElementById('team1').addEventListener('input', updateUrlBox);
    document.getElementById('team2').addEventListener('input', updateUrlBox);
    document.getElementById('raceTo1').addEventListener('input', updateUrlBox);
    document.getElementById('raceTo2').addEventListener('input', updateUrlBox);
    document.getElementById('s1').addEventListener('input', updateUrlBox);
    document.getElementById('s2').addEventListener('input', updateUrlBox);
    document.getElementById('copyUrl').addEventListener('click', function() {
      var url = buildUrl();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function() {
          var t = document.getElementById('toast');
          t.textContent = 'URL copied to clipboard';
          t.classList.add('show');
          setTimeout(function() { t.classList.remove('show'); }, 2000);
        });
      } else {
        document.getElementById('urlBox').textContent = 'Copy this URL: ' + url;
      }
    });
    document.getElementById('openUrl').addEventListener('click', function() {
      window.open(buildUrl(), '_blank');
    });
    updateUrlBox();
  </script>
</body>
</html>
